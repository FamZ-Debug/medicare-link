<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยืนยันตัวตน - MediCare Link</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        .otp-container {
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
            margin: 2rem 0;
        }

        .otp-input {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 800;
            border: 1px solid #e5e7eb;
            border-radius: 1rem;
            background: #f9fafb;
            outline: none;
            transition: var(--transition);
        }

        .otp-input:focus {
            border-color: var(--primary-color);
            background: white;
            box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.1);
        }
    </style>
</head>

<body>
    <div class="mobile-container">
        <div class="header-nav">
            <a href="register.html"
                style="color: var(--text-main); text-decoration: none; display: flex; align-items: center; gap: 0.5rem;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6" />
                </svg>
                <span>ย้อนกลับ</span>
            </a>
        </div>

        <div class="content content-centered">
            <div class="fade-in text-center">
                <div class="mb-4" style="color: var(--primary-color); display: flex; justify-content: center;">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                </div>
                <h1 class="mb-2">ยืนยันตัวตน</h1>
                <p class="subtitle mb-8">รหัส OTP ได้ส่งไปยังเบอร์ 081-XXX-4567 แล้ว</p>

                <div class="otp-container">
                    <input type="text" maxlength="1" class="otp-input" autofocus>
                    <input type="text" maxlength="1" class="otp-input">
                    <input type="text" maxlength="1" class="otp-input">
                    <input type="text" maxlength="1" class="otp-input">
                    <input type="text" maxlength="1" class="otp-input">
                    <input type="text" maxlength="1" class="otp-input">
                </div>

                <div class="mb-8">
                    <p style="color: var(--text-muted); font-size: 0.875rem;">
                        ยังได้รับรหัส? <a href="#"
                            style="color: var(--primary-color); text-decoration: none; font-weight: 600;">ส่งใหม่อีกครั้ง
                            (59s)</a>
                    </p>
                </div>

                <a href="profile.html" class="btn btn-primary">ยืนยัน</a>
            </div>
        </div>
    </div>

    <script>
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
</body>

</html>
