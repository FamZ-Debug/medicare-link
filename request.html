<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จองบริการ - MediCare Link</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="mobile-container">
        <div class="header-nav">
            <a href="home.html"
                style="color: var(--text-main); text-decoration: none; display: flex; align-items: center; gap: 0.5rem;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6" />
                </svg>
                <span>ย้อนกลับ</span>
            </a>
            <h3 style="font-weight: 800;">จองบริการ</h3>
            <div style="width: 24px;"></div> <!-- Spacer -->
        </div>

        <div class="content">
            <div class="fade-in">
                <div class="input-group">
                    <label>เลือกบริการ</label>
                    <select class="input-field">
                        <option>นัดหมายแพทย์ทั่วไป</option>
                        <option>ล้างแผล / ทำแผล</option>
                        <option>กายภาพบำบัด</option>
                        <option>ตรวจเลือดที่บ้าน</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>วันที่ต้องการรับบริการ</label>
                    <input type="date" class="input-field" value="2026-02-18">
                </div>

                <div class="input-group">
                    <label>ช่วงเวลา</label>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem;">
                        <div
                            style="padding: 0.75rem; border: 1px solid var(--primary-color); border-radius: 1rem; text-align: center; color: var(--primary-color); font-weight: 700; background: #f0fdfa;">
                            09:00</div>
                        <div
                            style="padding: 0.75rem; border: 1px solid #e5e7eb; border-radius: 1rem; text-align: center; color: var(--text-muted);">
                            11:00</div>
                        <div
                            style="padding: 0.75rem; border: 1px solid #e5e7eb; border-radius: 1rem; text-align: center; color: var(--text-muted);">
                            14:00</div>
                    </div>
                </div>

                <div class="input-group">
                    <label>อาการเบื้องต้น / รายละเอียดเพิ่มเติม</label>
                    <textarea class="input-field" rows="4" placeholder="ระบุรายละเอียดที่นี่..."></textarea>
                </div>

                <div style="background: #f8fafc; padding: 1.5rem; border-radius: 1.5rem; margin-top: 2rem;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span style="color: var(--text-muted);">ค่าบริการ</span>
                        <span style="font-weight: 600;">฿500.00</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                        <span style="color: var(--text-muted);">ค่าดำเนินการ</span>
                        <span style="font-weight: 600;">฿50.00</span>
                    </div>
                    <div
                        style="border-top: 1px dashed #cbd5e1; padding-top: 1rem; display: flex; justify-content: space-between;">
                        <span style="font-weight: 800;">ยอดรวมสุทธิ</span>
                        <span style="font-weight: 800; color: var(--primary-color); font-size: 1.25rem;">฿550.00</span>
                    </div>
                </div>

                <div style="margin-top: 2rem; padding-bottom: 2rem;">
                    <a href="payment.html" class="btn btn-primary">ขำระเงิน</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
