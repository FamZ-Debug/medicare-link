<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เลือกบทบาท - MediCare Link</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="mobile-container">
        <!-- Header -->
        <div class="page-header">
            <button class="back-btn" onclick="history.back()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>
            <h1>เลือกบทบาทของคุณ</h1>
        </div>

        <!-- Content -->
        <div class="content-container">
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <!-- User/Customer Role -->
                <a href="patient-category.html" class="role-card fade-in">
                    <div class="role-icon bg-teal-light">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </div>
                    <div class="role-content">
                        <h3>ลูกค้า (User)</h3>
                        <p>สำหรับผู้ใช้บริการและครอบครัว</p>
                    </div>
                </a>

                <!-- Provider Role -->
                <a href="provider-dashboard.html" class="role-card fade-in" style="animation-delay: 0.1s;">
                    <div class="role-icon bg-blue-light">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22 12h-4l-3 9L9 3l-3 9H2" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                    <div class="role-content">
                        <h3>ผู้ให้บริการ (Provider)</h3>
                        <p>สำหรับแพทย์ พยาบาล และผู้ดูแล</p>
                    </div>
                </a>

                <!-- Admin Role -->
                <a href="#" class="role-card fade-in" style="animation-delay: 0.2s;">
                    <div class="role-icon bg-purple-light">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            <line x1="9" y1="9" x2="15" y2="9" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <line x1="9" y1="15" x2="15" y2="15" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                    <div class="role-content">
                        <h3>ผู้ดูแลระบบ (Admin)</h3>
                        <p>สำหรับผู้จัดการระบบ</p>
                    </div>
                </a>
            </div>
        </div>
    </div>
</body>

</html>
