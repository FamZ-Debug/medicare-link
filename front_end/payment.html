<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ชำระเงิน - MediCare Link</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        .payment-option {
            display: flex;
            align-items: center;
            padding: 1.25rem;
            border: 1px solid #e5e7eb;
            border-radius: 1.25rem;
            margin-bottom: 1rem;
            transition: var(--transition);
            cursor: pointer;
            gap: 1rem;
        }

        .payment-option:hover {
            border-color: var(--primary-color);
            background: #f0fdfa;
        }

        .payment-option.active {
            border-color: var(--primary-color);
            background: #f0fdfa;
            box-shadow: 0 0 0 1px var(--primary-color);
        }

        .icon-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }

        .payment-option.active .icon-circle {
            background: var(--primary-color);
            color: white;
        }
    </style>
</head>

<body>
    <div class="mobile-container">
        <div class="header-nav">
            <a href="request.html"
                style="color: var(--text-main); text-decoration: none; display: flex; align-items: center; gap: 0.5rem;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6" />
                </svg>
                <span>ย้อนกลับ</span>
            </a>
        </div>

        <div class="content">
            <div class="fade-in">
                <h1 class="mb-2">ชำระเงิน</h1>
                <p class="subtitle mb-8">เลือกช่องทางการชำระเงินที่คุณสะดวก</p>

                <div class="payment-option active">
                    <div class="icon-circle">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="20" height="14" x="2" y="5" rx="2" />
                            <line x1="2" y1="10" x2="22" y2="10" />
                        </svg>
                    </div>
                    <div style="flex: 1;">
                        <span style="font-weight: 700; display: block;">บัตรเครดิต / เดบิต</span>
                        <span style="font-size: 0.75rem; color: var(--text-muted);">Visa, Mastercard, JCB</span>
                    </div>
                    <div
                        style="width: 20px; height: 20px; border: 2px solid var(--primary-color); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                        <div style="width: 10px; height: 10px; background: var(--primary-color); border-radius: 50%;">
                        </div>
                    </div>
                </div>

                <div class="payment-option">
                    <div class="icon-circle">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2Z" />
                            <path d="M12 18h.01" />
                        </svg>
                    </div>
                    <div style="flex: 1;">
                        <span style="font-weight: 700; display: block;">โมบายแบงก์กิ้ง</span>
                        <span style="font-size: 0.75rem; color: var(--text-muted);">K-Plus, SCB Easy, etc.</span>
                    </div>
                </div>

                <div class="payment-option">
                    <div class="icon-circle">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="16" height="20" x="4" y="2" rx="2" />
                            <path d="M12 18h.01" />
                            <path d="M16 8h-8" />
                            <path d="M16 12h-8" />
                        </svg>
                    </div>
                    <div style="flex: 1;">
                        <span style="font-weight: 700; display: block;">พร้อมเพย์ (PromptPay)</span>
                        <span style="font-size: 0.75rem; color: var(--text-muted);">สแกน QR Code</span>
                    </div>
                </div>

                <div style="margin-top: 4rem;">
                    <button class="btn btn-primary" onclick="window.location.href='success.html';">ยืนยันยอดเงิน
                        ฿550.00</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
