<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียน - MediCare Link</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="mobile-container">
        <div class="header-nav">
            <a href="index.html"
                style="color: var(--text-main); text-decoration: none; display: flex; align-items: center; gap: 0.5rem;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6" />
                </svg>
                <span>ย้อนกลับ</span>
            </a>
        </div>

        <div class="content content-centered">
            <div class="fade-in">
                <h1 class="mb-2">สร้างบัญชีใหม่</h1>
                <p class="subtitle mb-8">เริ่มต้นการดูแลคนที่คุณรักได้ทันที</p>

                <form action="verify.html" id="registerForm">
                    <div class="input-group">
                        <label for="fullname">ชื่อ-นามสกุล</label>
                        <input type="text" id="fullname" class="input-field" placeholder="ตัวอย่าง: สมชาย ใจดี"
                            required>
                    </div>

                    <div class="input-group">
                        <label for="phone">เบอร์โทรศัพท์</label>
                        <input type="tel" id="phone" class="input-field" placeholder="08XXXXXXXX" required>
                    </div>

                    <div class="input-group">
                        <label for="email">อีเมล</label>
                        <input type="email" id="email" class="input-field" placeholder="example@mail.com" required>
                    </div>

                    <div class="input-group">
                        <label for="password">รหัสผ่าน</label>
                        <input type="password" id="password" class="input-field" placeholder="อย่างน้อย 8 ตัวอักษร"
                            required>
                    </div>

                    <div class="input-group">
                        <label for="confirm-password">ยืนยันรหัสผ่าน</label>
                        <input type="password" id="confirm-password" class="input-field" placeholder="••••••••"
                            required>
                    </div>

                    <div style="margin-bottom: 2rem; display: flex; gap: 0.75rem; align-items: flex-start;">
                        <input type="checkbox" id="terms" style="margin-top: 0.25rem;" required>
                        <label for="terms" style="font-size: 0.875rem; color: var(--text-muted);">
                            ฉันยอมรับ <a href="#"
                                style="color: var(--primary-color); text-decoration: none;">เงื่อนไขการให้บริการ</a> และ
                            <a href="#"
                                style="color: var(--primary-color); text-decoration: none;">นโยบายความเป็นส่วนตัว</a>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary">ลงทะเบียน</button>
                </form>

                <div class="text-center mt-8" style="padding-bottom: 2rem;">
                    <p style="color: var(--text-muted); font-size: 0.875rem;">
                        มีบัญชีอยู่แล้ว? <a href="login.html"
                            style="color: var(--primary-color); text-decoration: none; font-weight: 600;">เข้าสู่ระบบ</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
