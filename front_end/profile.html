<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลส่วนตัว - MediCare Link</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        .profile-pic-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            position: relative;
        }

        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 4px solid white;
            box-shadow: var(--shadow);
        }

        .upload-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--primary-color);
            color: white;
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div class="mobile-container">
        <div class="header-nav">
            <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                <h2 style="font-weight: 800;">ข้อมูลส่วนตัว</h2>
                <a href="index.html"
                    style="color: var(--text-muted); text-decoration: none; font-size: 0.875rem;">ข้าม</a>
            </div>
        </div>

        <div class="content">
            <div class="fade-in">
                <div class="profile-pic-container">
                    <div class="profile-pic">
                        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                    </div>
                    <div class="upload-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14M5 12h14" />
                        </svg>
                    </div>
                </div>

                <form action="#" id="profileForm">
                    <div class="input-group">
                        <label for="nickname">ชื่อเล่น</label>
                        <input type="text" id="nickname" class="input-field" placeholder="ตัวอย่าง: กุ้ง">
                    </div>

                    <div class="input-group">
                        <label for="birthdate">วันเกิด</label>
                        <input type="date" id="birthdate" class="input-field">
                    </div>

                    <div class="input-group">
                        <label for="gender">เพศ</label>
                        <select id="gender" class="input-field">
                            <option value="">เลือกเพศ</option>
                            <option value="male">ชาย</option>
                            <option value="female">หญิง</option>
                            <option value="other">อื่นๆ</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="blood">กรุ๊ปเลือด</label>
                        <select id="blood" class="input-field">
                            <option value="">เลือกกรุ๊ปเลือด</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="AB">AB</option>
                            <option value="O">O</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="weight">น้ำหนัก (กก.)</label>
                        <input type="number" id="weight" class="input-field" placeholder="00.0">
                    </div>

                    <div class="input-group" style="margin-bottom: 3rem;">
                        <label for="height">ส่วนสูง (ซม.)</label>
                        <input type="number" id="height" class="input-field" placeholder="000">
                    </div>

                    <button type="submit" class="btn btn-primary"
                        onclick="window.location.href='home.html'; return false;">บันทึกข้อมูล</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
