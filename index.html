<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare Link - ดูแลคนที่คุณรัก</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="mobile-container">
        <div class="split-screen">
            <!-- Top Half: Teal Background with Logo -->
            <div class="split-top fade-in">
                <div class="logo">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="currentColor"/>
                    </svg>
                </div>
                <h1>MediCare Link</h1>
                <p>ดูแลคนที่คุณรัก เหมือนครอบครัวของเรา</p>
            </div>

            <!-- Bottom Half: White Card with Buttons -->
            <div class="split-bottom fade-in" style="animation-delay: 0.2s;">
                <div class="button-group">
                    <a href="login.html" class="btn btn-primary">เข้าสู่ระบบ</a>
                    <a href="register.html" class="btn btn-outline">ลงทะเบียนใหม่</a>
                </div>
                
                <div class="splash-footer" style="margin-top: 2rem; text-align: center;">
                    <p style="font-size: 0.75rem; color: var(--text-muted);">
                        การใช้งานหมายถึงคุณยอมรับ <a href="#" style="color: var(--primary-color); text-decoration: none;">เงื่อนไขการให้บริการ</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
